<script>

/* =========================================
   CANVAS SETUP
========================================= */

const canvas =
    document.getElementById("network");

const ctx =
    canvas.getContext("2d");


let width;
let height;

let particles = [];


/* =========================================
   CONNECTION DISTANCE
========================================= */

const MAX_DISTANCE = 145;


/* =========================================
   RESPONSIVE PARTICLE COUNT
========================================= */

function getParticleCount() {

    const area =
        window.innerWidth *
        window.innerHeight;


    if (
        window.innerWidth < 600
    ) {

        return Math.min(

            75,

            Math.floor(
                area / 8500
            )
        );
    }


    return Math.min(

        170,

        Math.floor(
            area / 7000
        )
    );
}


/* =========================================
   RESIZE CANVAS
========================================= */

function resizeCanvas() {

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width * ratio;

    canvas.height =
        height * ratio;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(

        ratio,
        0,

        0,
        ratio,

        0,
        0
    );


    createParticles();
}


/* =========================================
   PARTICLE CLASS
========================================= */

class Particle {

    constructor() {

        this.x =
            Math.random() * width;

        this.y =
            Math.random() * height;


        this.radius =

            Math.random() *
            1.5 +

            0.4;


        this.speedX =

            (
                Math.random() -
                0.5
            )

            *

            0.22;


        this.speedY =

            (
                Math.random() -
                0.5
            )

            *

            0.22;


        this.brightness =

            Math.random() *
            0.55 +

            0.45;


        this.phase =

            Math.random() *
            Math.PI *
            2;
    }


    update() {


        this.x +=
            this.speedX;

        this.y +=
            this.speedY;


        this.phase +=
            0.015;


        /* SCREEN WRAP */

        if (
            this.x < -10
        ) {

            this.x =
                width + 10;
        }


        if (
            this.x >
            width + 10
        ) {

            this.x =
                -10;
        }


        if (
            this.y < -10
        ) {

            this.y =
                height + 10;
        }


        if (
            this.y >
            height + 10
        ) {

            this.y =
                -10;
        }
    }


    draw(time) {


        const pulse =

            0.65 +

            Math.sin(

                time *
                0.002 +

                this.phase

            )

            *

            0.35;


        const alpha =

            this.brightness *
            pulse;


        /* PARTICLE GLOW */

        ctx.beginPath();


        ctx.arc(

            this.x,
            this.y,

            this.radius * 3,

            0,

            Math.PI * 2
        );


        ctx.fillStyle =

            `rgba(
                33,
                151,
                255,
                ${alpha * 0.08}
            )`;


        ctx.fill();


        /* PARTICLE */

        ctx.beginPath();


        ctx.arc(

            this.x,
            this.y,

            this.radius,

            0,

            Math.PI * 2
        );


        ctx.fillStyle =

            `rgba(
                100,
                196,
                255,
                ${alpha}
            )`;


        ctx.fill();
    }
}


/* =========================================
   CREATE PARTICLES
========================================= */

function createParticles() {

    particles = [];


    const count =
        getParticleCount();


    for (

        let i = 0;

        i < count;

        i++

    ) {

        particles.push(

            new Particle()

        );
    }
}


/* =========================================
   DRAW BACKGROUND
========================================= */

function drawBackground() {


    const gradient =

        ctx.createLinearGradient(

            0,
            0,

            width,
            height
        );


    gradient.addColorStop(

        0,

        "#071526"
    );


    gradient.addColorStop(

        0.45,

        "#020a17"
    );


    gradient.addColorStop(

        1,

        "#020711"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(

        0,
        0,

        width,
        height
    );


    /* CENTER ATMOSPHERIC GLOW */

    const glow =

        ctx.createRadialGradient(

            width * 0.52,
            height * 0.45,

            0,

            width * 0.52,
            height * 0.45,

            Math.max(
                width,
                height
            )

            *

            0.65
        );


    glow.addColorStop(

        0,

        "rgba(18, 79, 130, 0.18)"
    );


    glow.addColorStop(

        0.45,

        "rgba(7, 36, 68, 0.10)"
    );


    glow.addColorStop(

        1,

        "rgba(0, 0, 0, 0)"
    );


    ctx.fillStyle =
        glow;


    ctx.fillRect(

        0,
        0,

        width,
        height
    );
}


/* =========================================
   CONNECT PARTICLES
========================================= */

function connectParticles() {

    for (

        let i = 0;

        i < particles.length;

        i++

    ) {

        for (

            let j = i + 1;

            j < particles.length;

            j++

        ) {


            const dx =

                particles[i].x -

                particles[j].x;


            const dy =

                particles[i].y -

                particles[j].y;


            const distance =

                Math.sqrt(

                    dx * dx +

                    dy * dy

                );


            if (

                distance <

                MAX_DISTANCE

            ) {


                const opacity =

                    1 -

                    distance /

                    MAX_DISTANCE;


                ctx.beginPath();


                ctx.moveTo(

                    particles[i].x,

                    particles[i].y
                );


                ctx.lineTo(

                    particles[j].x,

                    particles[j].y
                );


                ctx.strokeStyle =

                    `rgba(

                        45,
                        151,
                        235,

                        ${opacity * 0.23}

                    )`;


                ctx.lineWidth =

                    opacity *
                    0.8;


                ctx.stroke();
            }
        }
    }
}


/* =========================================
   MAIN ANIMATION
========================================= */

function animate(time) {


    drawBackground();


    connectParticles();


    for (

        const particle

        of particles

    ) {


        particle.update();


        particle.draw(time);
    }


    requestAnimationFrame(

        animate

    );
}


/* =========================================
   START
========================================= */

window.addEventListener(

    "resize",

    resizeCanvas
);


resizeCanvas();


animate(0);

</script>
