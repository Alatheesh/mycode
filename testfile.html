# NTM Animated Background Test

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NTM Animated Background</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020814;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    #network {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    /* subtle dark overlay so the center stays readable */
    .atmosphere {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;

        background:
            radial-gradient(
                circle at center,
                rgba(5, 24, 45, 0.10) 0%,
                rgba(2, 8, 20, 0.15) 40%,
                rgba(0, 0, 0, 0.35) 100%
            );
    }

    /* CENTRAL LOGO */
    .logo-stage {
        position: fixed;
        top: 50%;
        left: 50%;

        width: min(42vw, 430px);
        aspect-ratio: 1;

        transform: translate(-50%, -50%) scale(0.82);
        opacity: 0;

        z-index: 5;

        display: flex;
        align-items: center;
        justify-content: center;

        animation:
            logoEnter 1.6s cubic-bezier(.18,.85,.25,1)
            2.2s forwards;
    }

    /* Dark center circle */
    .logo-core {
        position: absolute;
        inset: 7%;

        border-radius: 50%;

        background:
            radial-gradient(
                circle at 45% 35%,
                rgba(16, 45, 72, 0.85),
                rgba(2, 10, 23, 0.96) 62%,
                rgba(0, 4, 12, 0.98)
            );

        box-shadow:
            inset 0 0 50px rgba(0, 0, 0, 0.9),
            0 0 80px rgba(0, 104, 190, 0.18);
    }

    /* OUTER GLOWING RING */
    .ring {
        position: absolute;
        inset: 0;

        border-radius: 50%;

        border: 3px solid rgba(82, 194, 255, 0.85);

        box-shadow:
            0 0 5px rgba(105, 209, 255, 1),
            0 0 15px rgba(50, 177, 255, 0.9),
            0 0 35px rgba(0, 119, 255, 0.7),
            0 0 70px rgba(0, 98, 255, 0.4),
            inset 0 0 10px rgba(115, 210, 255, 0.7);

        animation:
            ringPulse 3.5s ease-in-out infinite;
    }

    /* second thin inner ring */
    .ring::before {
        content: "";

        position: absolute;
        inset: 10px;

        border-radius: 50%;

        border: 1px solid rgba(116, 203, 255, 0.28);

        box-shadow:
            inset 0 0 12px rgba(40, 140, 255, 0.25);
    }

    /* moving highlight around the ring */
    .ring::after {
        content: "";

        position: absolute;
        inset: -4px;

        border-radius: 50%;

        border: 4px solid transparent;

        border-top-color: rgba(193, 239, 255, 0.95);
        border-right-color: rgba(63, 179, 255, 0.45);

        filter: drop-shadow(0 0 8px #61caff);

        animation:
            rotateRing 6s linear infinite;
    }

    /* TEXT */
    .logo-text {
        position: relative;
        z-index: 3;

        width: 100%;

        text-align: center;

        transform:
            translateY(-2%);
    }

    .ntm {
        font-size: clamp(62px, 8vw, 125px);

        font-weight: 900;

        letter-spacing: -5px;

        line-height: 0.85;

        color: transparent;

        -webkit-text-stroke: 2px #63c8ff;

        text-shadow:
            0 0 2px #c4efff,
            0 0 8px #58c2ff,
            0 0 18px #198ee8,
            0 0 35px rgba(0, 119, 255, 0.75);

        opacity: 0;

        animation:
            textReveal 1.3s ease-out
            3.1s forwards;
    }

    .online {
        margin-top: 12px;

        font-size: clamp(20px, 2.6vw, 42px);

        font-weight: 500;

        letter-spacing: 1px;

        color: #54bfff;

        text-shadow:
            0 0 5px #65caff,
            0 0 15px rgba(0, 128, 255, 0.9),
            0 0 30px rgba(0, 102, 255, 0.55);

        opacity: 0;

        transform: translateY(10px);

        animation:
            onlineReveal 0.8s ease-out
            4s forwards;
    }

    /* bottom reflection glow */
    .bottom-glow {
        position: absolute;

        bottom: -8%;

        left: 50%;

        width: 60%;

        height: 20%;

        transform: translateX(-50%);

        border-radius: 50%;

        background:
            radial-gradient(
                ellipse,
                rgba(33, 157, 255, 0.55),
                rgba(0, 80, 255, 0.12) 45%,
                transparent 72%
            );

        filter: blur(16px);

        animation:
            bottomPulse 3s ease-in-out infinite;
    }

    @keyframes logoEnter {
        0% {
            opacity: 0;
            transform:
                translate(-50%, -50%)
                scale(0.60);
        }

        55% {
            opacity: 1;
        }

        100% {
            opacity: 1;
            transform:
                translate(-50%, -50%)
                scale(1);
        }
    }

    @keyframes ringPulse {
        0%,
        100% {
            filter: brightness(0.85);
        }

        50% {
            filter: brightness(1.35);
        }
    }

    @keyframes rotateRing {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    @keyframes textReveal {
        0% {
            opacity: 0;

            transform:
                scale(0.92);

            filter: blur(8px);
        }

        100% {
            opacity: 1;

            transform:
                scale(1);

            filter: blur(0);
        }
    }

    @keyframes onlineReveal {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes bottomPulse {
        0%,
        100% {
            opacity: 0.55;
            transform:
                translateX(-50%)
                scale(0.9);
        }

        50% {
            opacity: 1;
            transform:
                translateX(-50%)
                scale(1.1);
        }
    }

    /* MOBILE */
    @media (max-width: 700px) {

        .logo-stage {
            width: min(78vw, 400px);
        }

        .ntm {
            -webkit-text-stroke-width: 1.5px;
            letter-spacing: -3px;
        }

        .online {
            margin-top: 8px;
        }

        .ring {
            border-width: 2px;
        }
    }

    /* Respect reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
        }
    }
</style>
</head>

<body>

    <canvas id="network"></canvas>

    <div class="atmosphere"></div>

    <div class="logo-stage">

        <div class="logo-core"></div>

        <div class="ring"></div>

        <div class="bottom-glow"></div>

        <div class="logo-text">

            <div class="ntm">
                NTM
            </div>

            <div class="online">
                Online
            </div>

        </div>

    </div>


<script>

const canvas = document.getElementById("network");
const ctx = canvas.getContext("2d");

let width;
let height;
let particles = [];

const MAX_DISTANCE = 145;


/* RESPONSIVE PARTICLE COUNT */

function getParticleCount() {

    const area = window.innerWidth * window.innerHeight;

    if (window.innerWidth < 600) {
        return Math.min(75, Math.floor(area / 8500));
    }

    return Math.min(170, Math.floor(area / 7000));
}


/* RESIZE */

function resizeCanvas() {

    const ratio = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * ratio;
    canvas.height = height * ratio;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    createParticles();
}


/* PARTICLE */

class Particle {

    constructor() {

        this.x = Math.random() * width;
        this.y = Math.random() * height;

        this.radius =
            Math.random() * 1.5 + 0.4;

        this.speedX =
            (Math.random() - 0.5) * 0.22;

        this.speedY =
            (Math.random() - 0.5) * 0.22;

        this.brightness =
            Math.random() * 0.55 + 0.45;

        this.phase =
            Math.random() * Math.PI * 2;
    }


    update() {

        this.x += this.speedX;
        this.y += this.speedY;

        this.phase += 0.015;


        /* Wrap around */

        if (this.x < -10)
            this.x = width + 10;

        if (this.x > width + 10)
            this.x = -10;

        if (this.y < -10)
            this.y = height + 10;

        if (this.y > height + 10)
            this.y = -10;
    }


    draw(time) {

        const pulse =
            0.65 +
            Math.sin(
                time * 0.002 +
                this.phase
            ) * 0.35;

        const alpha =
            this.brightness * pulse;


        /* glow */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius * 3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(33, 151, 255, ${alpha * 0.08})`;

        ctx.fill();


        /* particle */

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(100, 196, 255, ${alpha})`;

        ctx.fill();
    }
}


/* CREATE PARTICLES */

function createParticles() {

    particles = [];

    const count =
        getParticleCount();

    for (
        let i = 0;
        i < count;
        i++
    ) {

        particles.push(
            new Particle()
        );

    }
}


/* DRAW BACKGROUND */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            width,
            height
        );

    gradient.addColorStop(
        0,
        "#071526"
    );

    gradient.addColorStop(
        0.45,
        "#020a17"
    );

    gradient.addColorStop(
        1,
        "#020711"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* blue atmospheric glow */

    const glow =
        ctx.createRadialGradient(
            width * 0.52,
            height * 0.45,
            0,
            width * 0.52,
            height * 0.45,
            Math.max(width, height) * 0.65
        );

    glow.addColorStop(
        0,
        "rgba(18, 79, 130, 0.18)"
    );

    glow.addColorStop(
        0.45,
        "rgba(7, 36, 68, 0.10)"
    );

    glow.addColorStop(
        1,
        "rgba(0, 0, 0, 0)"
    );

    ctx.fillStyle = glow;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );
}


/* CONNECT PARTICLES */

function connectParticles() {

    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < particles.length;
            j++
        ) {

            const dx =
                particles[i].x -
                particles[j].x;

            const dy =
                particles[i].y -
                particles[j].y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                MAX_DISTANCE
            ) {

                const opacity =
                    1 -
                    distance /
                    MAX_DISTANCE;


                ctx.beginPath();

                ctx.moveTo(
                    particles[i].x,
                    particles[i].y
                );

                ctx.lineTo(
                    particles[j].x,
                    particles[j].y
                );


                ctx.strokeStyle =
                    `rgba(
                        45,
                        151,
                        235,
                        ${opacity * 0.23}
                    )`;


                ctx.lineWidth =
                    opacity * 0.8;


                ctx.stroke();

            }

        }

    }

}


/* MAIN LOOP */

function animate(time) {

    drawBackground();

    connectParticles();


    for (
        const particle
        of particles
    ) {

        particle.update();

        particle.draw(time);

    }


    requestAnimationFrame(
        animate
    );
}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();

animate(0);

</script>

</body>
</html>
```
